<!-- ===== MODAL APP PALLACE =====
     Cole este bloco logo ANTES de </body> no index.html
     (de preferência antes de <script src="script.js"></script>) -->

<div class="app-modal" id="appModal" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
  <div class="app-modal__box">
    <button class="app-modal__close" id="appModalClose" aria-label="Fechar">&times;</button>

    <div class="app-modal__body">
      <div class="app-modal__content">
        <img
          class="app-modal__logo"
          src="https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=440,fit=crop,q=95/m6LrpJWxljuQv6p7/logotipo-pallace-branca-2-YBgpgpljr4HL9970.png"
          alt="Pallace Barbearia"
        />

        <span class="app-modal__tag">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M3 10v4a1 1 0 0 0 1 1h2l5 4V5L6 9H4a1 1 0 0 0-1 1zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
          Boas notícias!
        </span>

        <h2 class="app-modal__title" id="appModalTitle">
          Agora você pode agendar através <span>do nosso app!</span>
        </h2>

        <p class="app-modal__text">
          Mais praticidade, agendamento rápido e tudo na palma da sua mão.
        </p>

        <a class="app-modal__download" id="appModalDownload" href="https://play.google.com/store/apps/details?id=pallacebarbearia.bestbarbers.app" target="_blank" rel="noopener">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
          Baixar o App
        </a>

        <div class="app-modal__stores">
          <a class="store-badge store-badge--android" href="https://play.google.com/store/apps/details?id=pallacebarbearia.bestbarbers.app" target="_blank" rel="noopener">
            <svg width="26" height="28" viewBox="0 0 24 26"><path fill="#00d4ff" d="M1 1l12 12L1 25z"/><path fill="#00f076" d="M1 1l16 9-4 3z"/><path fill="#ff3a44" d="M1 25l16-9-4-3z"/><path fill="#ffd500" d="M17 10l5 3-5 3-4-3z"/></svg>
            <span><small>DISPONÍVEL NO</small><strong>Google Play</strong></span>
          </a>
          <a class="store-badge store-badge--ios" href="https://apps.apple.com/br/app/pallace-barbearia/id6810630471" target="_blank" rel="noopener">
            <svg width="24" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M16.4 12.7c0-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9s-1.9-.9-3.1-.8c-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.5.8 1.2 1.7 2.4 3 2.4 1.2 0 1.7-.8 3.100-.8s1.9.8 3.1.8c1.300 0 2.100-1.200 2.900-2.300.9-1.300 1.300-2.600 1.300-2.700-.1 0-2.500-1-2.500-3.900zM14.100 5.600c.7-.8 1.100-1.900 1-3-1 0-2.100.7-2.800 1.500-.6.700-1.200 1.800-1 2.900 1.100.1 2.100-.6 2.800-1.400z"/></svg>
            <span><small>Disponível na</small><strong>App Store</strong></span>
          </a>
        </div>
      </div>

      <div class="app-modal__visual" aria-hidden="true">
        <div class="app-modal__blob"></div>
        <img class="app-modal__phone" src="phone-app.png" alt="" />
      </div>
    </div>

    <div class="app-modal__footer">
      <span class="app-modal__footer-icon">i</span>
      Em caso de dúvidas, nossa equipe está sempre à disposição!
    </div>
  </div>
</div>

<script>
  (function () {
    var modal = document.getElementById("appModal");
    var closeBtn = document.getElementById("appModalClose");
    var downloadBtn = document.getElementById("appModalDownload");
    var KEY = "pallaceAppModalSeen";
    // true  = aparece só 1 vez por sessão (aba)
    // false = aparece em toda vez que a página carregar
    var SHOW_ONCE_PER_SESSION = false;

    var PLAY = "https://play.google.com/store/apps/details?id=pallacebarbearia.bestbarbers.app";
    var APPLE = "https://apps.apple.com/br/app/pallace-barbearia/id6810630471";

    // Detecta o aparelho: "ios", "android" ou "desktop"
    function getDevice() {
      var ua = navigator.userAgent || "";
      var isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS
      if (isIOS) return "ios";
      if (/Android/i.test(ua)) return "android";
      return "desktop";
    }

    var device = getDevice();
    modal.setAttribute("data-device", device); // o CSS esconde o selo que não serve

    // Botão "Baixar o App" vai direto para a loja do aparelho
    if (device === "ios") downloadBtn.href = APPLE;
    else if (device === "android") downloadBtn.href = PLAY;

    function open() {
      modal.classList.add("open");
    }

    function close() {
      modal.classList.remove("open");
      if (SHOW_ONCE_PER_SESSION) {
        try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
      }
    }

    closeBtn.addEventListener("click", close);
    modal.addEventListener("click", function (e) {
      if (e.target === modal) close();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") close();
    });

    // mostra uma vez por sessão, depois de 1s
    var seen = false;
    if (SHOW_ONCE_PER_SESSION) {
      try { seen = sessionStorage.getItem(KEY) === "1"; } catch (e) {}
    }
    if (!seen) setTimeout(open, 1000);
  })();
</script>
